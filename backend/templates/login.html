{% extends "base.html" %}
{% block title %}Вход | Orbityx{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2>Вход в аккаунт</h2>
        <div class="form-error" id="err"></div>
        <form id="login-form">
            <div class="form-group">
                <label>Email или имя пользователя</label>
                <input type="text" id="credential" placeholder="email@example.com" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="form-submit" id="submit-btn">Войти</button>
        </form>
        <div class="form-footer">
            Ещё нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err');
    const btn = document.getElementById('submit-btn');
    err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Входим...';
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            credentials: 'include',
            body: JSON.stringify({ credential: document.getElementById('credential').value, password: document.getElementById('password').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Ошибка входа');
        localStorage.setItem('access_token', data.access_token);
        const next = new URLSearchParams(location.search).get('next') || '/chart';
        window.location.href = next;
    } catch(ex) {
        err.textContent = ex.message; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Войти';
    }
});
</script>
{% endblock %}
