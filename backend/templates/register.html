{% extends "base.html" %}
{% block title %}Регистрация | Orbityx{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2>Создать аккаунт</h2>
        <div class="form-error" id="err"></div>
        <div class="form-success" id="ok">Аккаунт создан! <a href="/login">Войти</a></div>
        <form id="reg-form">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" placeholder="username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" id="phone" placeholder="+7 999 000 00 00" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="минимум 8 символов" required>
            </div>
            <button type="submit" class="form-submit" id="submit-btn">Зарегистрироваться</button>
        </form>
        <div class="form-footer">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
    </div>
</div>
<script>
document.getElementById('reg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err');
    const ok  = document.getElementById('ok');
    const btn = document.getElementById('submit-btn');
    err.style.display = 'none'; ok.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Регистрируем...';
    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value,
                email:    document.getElementById('email').value,
                phone:    document.getElementById('phone').value,
                password: document.getElementById('password').value,
            }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Ошибка регистрации');
        ok.style.display = 'block';
        document.getElementById('reg-form').reset();
    } catch(ex) {
        err.textContent = ex.message; err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Зарегистрироваться';
});
</script>
{% endblock %}
