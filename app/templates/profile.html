<!--
  Profile page template
  Notes:
  - Extends base.html and shows user's avatar (image or fallback initial).
  - Provides a form to upload a new avatar (multipart/form-data).
  - Comments only; no markup/logic changes.
-->
{% extends 'base.html' %}
<!-- Page <title> block -->
{% block title %}Профиль | Orbityx{% endblock %}
<!-- Main content: profile header, avatar display, and upload form -->
{% block content %}

    <!-- Container for profile section -->
<div class="profile-container">
    <h2>Профиль</h2>
        <!-- Username (display only) -->
    <h3>{{ user.username }}</h3>
        <!-- Avatar area: image if present, otherwise a colored initial -->
    <div class="avatar-display">
            <!-- If user uploaded an avatar, render it via Flask route -->
        {% if user.avatar %}
            <!-- Avatar image served by main.get_avatar -->
        <img src="{{ url_for('main.get_avatar', user_id=user.id) }}" alt="Аватар" class="avatar-img">
            <!-- Otherwise render a fallback circle with the first letter -->
        {% else %}
            <!-- Background color derived from username via get_color() helper -->
        <div class="avatar-fallback" style="background-color: {{ get_color(user.username) }}">
            {{ user.username[0] | upper }}
        </div>
        {% endif %}
    </div>

    <!-- Upload form (multipart) for changing avatar -->
    <form method="POST" enctype="multipart/form-data">
        <!-- CSRF token and hidden fields -->
        {{ form.hidden_tag() }}
        <div>
            <!-- File input label (WTForms) -->
            {{ form.avatar.label }}
            <!-- File input control for avatar image -->
            {{ form.avatar }}
        </div>
        <div>
            <!-- Submit button -->
            {{ form.submit }}
        </div>
    </form>
</div>
{% endblock %}
